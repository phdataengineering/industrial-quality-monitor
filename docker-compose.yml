services:
  industrial-api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-industrial_quality}
      POSTGRES_USER: ${DB_USER:-industrial_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-industrial_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_BASE_URL: http://industrial-api:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    depends_on:
      industrial-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  spark-etl:
    profiles: ["spark"]
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
      args:
        SPARK_UID: ${SPARK_UID:-1000}
        SPARK_GID: ${SPARK_GID:-1000}
    environment:
      HOME: /tmp
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_LOCAL_DIRS: /tmp/spark-local
      PYSPARK_PYTHON: python3
    command: ["python", "src/etl_spark.py"]
    volumes:
      - ./data:/app/data
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0

volumes:
  postgres_data:
